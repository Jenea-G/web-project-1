{% extends "base.html" %} {% block title %} Login | Picnic App {% endblock %}
{% block content %}
<section class="login">
    <div class="container">

        <h1>User login</h1>

        <div class="form-grid">
            <form method="post" class="form">
                <div>
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" value="{{ username or '' }}" required />
                </div>

                <div>
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required />
                </div>
                <div class="form-actions">
                    <button class="btn btn-small btn-small--light" type="submit">Log in</button>
                </div>
            </form>
            <div class="div-special">
                <p class="p-special">New to Picnic App?</p>
                <p class="p-special">Clic here <a href="{{ url_for('register') }}">to register</a></p>
            </div>
        </div>



    </div>
</section>
{% endblock %}
