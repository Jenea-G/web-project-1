{% extends "base.html" %} {% block title %} Edit Item | Picnic App {% endblock %}
{% block content %}
<section>
    <h1>Edit item</h1>

    <form action="{{ url_for('edit_item', item_id=item.id) }}" method="POST">
        <label>
            Item name
            <input type="text" name="item_name" value="{{ item.name }}">
        </label>

        <label>
            Category
            <select name="category">
                {% for category in picnic.selected_categories %}
                <option value="{{ category.name }}" {% if category==item.category %}selected{% endif %}>
                    {{ category.value }}
                </option>
                {% endfor %}
            </select>
        </label>

        <button type="submit">Save</button>
    </form>

    <a href="{{ url_for('picnic', picnic_id=picnic.id) }}">
        Cancel
    </a>
</section>
{% endblock %}
