{% extends "base.html" %} {% block title %} Edit "{{ picnic.picnic_name }}" | Picnic App {% endblock %}
{% block content %}
<section>
    <h1>Edit {{ picnic.picnic_name }}</h1>
    <form action="{{ url_for('edit_picnic', picnic_id=picnic.id) }}" method="POST">

        <div>
            <label for="picnic_name">Picnic name</label>
            <input type="text" id="picnic_name" name="picnic_name" maxlength="155" required
                value="{{ picnic.picnic_name }}">
        </div>

        <div>
            <label for="location">Location</label>
            <input type="text" id="location" name="location" maxlength="155" required value="{{ picnic.location }}">
        </div>

        <div>
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required value="{{ picnic.date }}">
        </div>

        <div>
            <label for="invitation_code">Invitation code</label>
            <input type="text" id="invitation_code" name="invitation_code" maxlength="155" required
                value="{{ picnic.invitation_code }}">
        </div>

        <fieldset>
            <legend>Categories</legend>

            <label>
                <input type="checkbox" name="categories" value="Food" {% if ItemCategory.FOOD in
                    picnic.selected_categories %}checked{% endif %}>
                Food
            </label>

            <label>
                <input type="checkbox" name="categories" value="Drinks" {% if ItemCategory.DRINKS in
                    picnic.selected_categories %}checked{% endif %}>
                Drinks
            </label>

            <label>
                <input type="checkbox" name="categories" value="Equipment" {% if ItemCategory.EQUIPMENT in
                    picnic.selected_categories %}checked{% endif %}>
                Equipment
            </label>

            <label>
                <input type="checkbox" name="categories" value="Desserts" {% if ItemCategory.DESSERTS in
                    picnic.selected_categories %}checked{% endif %}>
                Desserts
            </label>

            <label>
                <input type="checkbox" name="categories" value="Entertainment" {% if ItemCategory.ENTERTAINMENT in
                    picnic.selected_categories %}checked{% endif %}>
                Entertainment
            </label>

            <label>
                <input type="checkbox" name="categories" value="Snacks" {% if ItemCategory.SNACKS in
                    picnic.selected_categories %}checked{% endif %}>
                Snacks
            </label>
        </fieldset>

        <button type="submit">
            Save Changes
        </button>

    </form>
</section>
{% endblock %}
