<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Picnic App{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <script type="module" src="{{ url_for( 'static', filename='js/app.js' ) }}"></script>
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <a href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='images/logo.svg') }}"
                        alt="Logout"></a>

                <div>
                    {% if current_user.is_authenticated %}
                    <a href="{{ url_for('picnics') }}"><img src="{{ url_for('static', filename='images/basket.svg') }}"
                            alt="Picnics" class="nav-icon"></a>
                    <a href="{{ url_for('user_bp.logout') }}"><img
                            src="{{ url_for('static', filename='images/logout.svg') }}" alt="Logout"
                            class="nav-icon"></a>
                    {% else %}
                    <a href="{{ url_for('user_bp.login') }}"><img
                            src="{{ url_for('static', filename='images/login.svg') }}" alt="Login" class="nav-icon"></a>
                    {% endif %}
                </div>
            </nav>
        </div>

    </header>

    <main>
        <section class="feedback">

            {% with messages = get_flashed_messages( with_categories=true ) %} {% if
            messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                <p class="flash {{ category }}">{{ message }}</p>
                {% endfor %}
                <button type="button" id="close-btn" aria-label="Close">&times;</button>
            </div>
            {% endif %} {% endwith %}

        </section>

        {% block content %} {% endblock %}
    </main>
</body>

</html>
